groups:
  - name: hpc-node-current
    interval: 30s
    rules:
      - record: hpc:node_up
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (up{job="node-exporter"})

      - record: hpc:node_cpu_logical:count
        expr: count by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_cpu_seconds_total{job="node-exporter",mode="idle"})

      - record: hpc:node_memory_total:bytes
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_memory_MemTotal_bytes{job="node-exporter"})

      - record: hpc:node_memory_used:bytes
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_memory_MemTotal_bytes{job="node-exporter"} - node_memory_MemAvailable_bytes{job="node-exporter"})

      - record: hpc:node_cpu_busy:ratio5m
        expr: 1 - avg by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))

      - record: hpc:node_memory_used:ratio
        expr: 1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})

      - record: hpc:node_load_per_cpu:ratio5m
        expr: node_load5{job="node-exporter"} / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter",mode="idle"})

      - record: hpc:node_temperature_max:celsius
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_hwmon_temp_celsius{job="node-exporter"})

      - record: hpc:node_temperature_spread:celsius
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_hwmon_temp_celsius{job="node-exporter"}) - min by (cluster, partition, rack, role, hardware_class, node_profile, node) (node_hwmon_temp_celsius{job="node-exporter"})

      - record: hpc:node_network_receive:bytes_per_second5m
        expr: sum by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_network_receive_bytes_total{job="node-exporter",device!~"lo|veth.*|docker.*|cni.*"}[5m]))

      - record: hpc:node_network_transmit:bytes_per_second5m
        expr: sum by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_network_transmit_bytes_total{job="node-exporter",device!~"lo|veth.*|docker.*|cni.*"}[5m]))

      - record: hpc:node_network_errors:per_second5m
        expr: sum by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_network_receive_errs_total{job="node-exporter"}[5m]) + rate(node_network_transmit_errs_total{job="node-exporter"}[5m]))

      - record: hpc:node_network_drops:per_second5m
        expr: sum by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_network_receive_drop_total{job="node-exporter"}[5m]) + rate(node_network_transmit_drop_total{job="node-exporter"}[5m]))

      - record: hpc:node_disk_io_time:ratio5m
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_disk_io_time_seconds_total{job="node-exporter",device!~"loop.*|ram.*|dm-.*"}[5m]))

      - record: hpc:node_filesystem_used:ratio
        expr: max by (cluster, partition, rack, role, hardware_class, node_profile, node) (1 - node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|nsfs"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs|nsfs"})

      - record: hpc:node_pressure_cpu_waiting:ratio5m
        expr: rate(node_pressure_cpu_waiting_seconds_total{job="node-exporter"}[5m])

      - record: hpc:node_pressure_memory_waiting:ratio5m
        expr: rate(node_pressure_memory_waiting_seconds_total{job="node-exporter"}[5m])

      - record: hpc:node_pressure_io_waiting:ratio5m
        expr: rate(node_pressure_io_waiting_seconds_total{job="node-exporter"}[5m])

      - record: hpc:node_nfs_rpc_operations:per_second5m
        expr: sum by (cluster, partition, rack, role, hardware_class, node_profile, node) (rate(node_nfs_requests_total{job="node-exporter"}[5m]))

      - record: hpc:node_cpu_profile_match
        expr: hpc:node_cpu_logical:count == bool on (cluster, node) hpc_node_profile_cpu_threads{job="node-exporter"}

      - record: hpc:node_memory_profile_match
        expr: (abs(hpc:node_memory_total:bytes - on (cluster, node) hpc_node_profile_memory_bytes{job="node-exporter"}) / on (cluster, node) hpc_node_profile_memory_bytes{job="node-exporter"}) <= bool 0.02

      - record: hpc:node_profile_match
        expr: hpc:node_cpu_profile_match * on (cluster, node) hpc:node_memory_profile_match

      # State: 0 healthy, 1 warning, 2 critical, 3 down. The extra `reason`
      # label makes each condition a distinct series before max removes it.
      - record: hpc:node_health:state
        expr: max without (reason) (label_replace(3 * (hpc:node_up == bool 0), "reason", "down", "", "") or label_replace(2 * (hpc:node_temperature_max:celsius >= bool 95), "reason", "temperature_critical", "", "") or label_replace(1 * (hpc:node_temperature_max:celsius >= bool 85), "reason", "temperature_warning", "", "") or label_replace(1 * (hpc:node_network_errors:per_second5m > bool 1), "reason", "network_errors", "", "") or label_replace(1 * (hpc:node_filesystem_used:ratio > bool 0.90), "reason", "filesystem", "", "") or label_replace(1 * (hpc:node_profile_match == bool 0), "reason", "profile_mismatch", "", ""))

  - name: hpc-fleet-rollups
    interval: 1m
    rules:
      - record: hpc:rack_temperature:p95_celsius
        expr: quantile by (cluster, partition, rack) (0.95, hpc:node_temperature_max:celsius)

      - record: hpc:rack_temperature:max_celsius
        expr: max by (cluster, partition, rack) (hpc:node_temperature_max:celsius)

      - record: hpc:partition_cpu_busy:ratio5m
        expr: avg by (cluster, partition) (hpc:node_cpu_busy:ratio5m)

      - record: hpc:partition_nodes:count
        expr: count by (cluster, partition) (hpc:node_up)

      - record: hpc:partition_nodes_up:count
        expr: sum by (cluster, partition) (hpc:node_up)

      - record: hpc:cluster_cpu_total:cores
        expr: sum by (cluster) (hpc:node_cpu_logical:count * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:cluster_cpu_used:cores5m
        expr: sum by (cluster) (hpc:node_cpu_logical:count * on (cluster, node) hpc:node_cpu_busy:ratio5m * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:cluster_memory_total:bytes
        expr: sum by (cluster) (hpc:node_memory_total:bytes * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:cluster_memory_used:bytes
        expr: sum by (cluster) (hpc:node_memory_used:bytes * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:partition_cpu_total:cores
        expr: sum by (cluster, partition) (hpc:node_cpu_logical:count * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:partition_cpu_used:cores5m
        expr: sum by (cluster, partition) (hpc:node_cpu_logical:count * on (cluster, node) hpc:node_cpu_busy:ratio5m * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:partition_memory_total:bytes
        expr: sum by (cluster, partition) (hpc:node_memory_total:bytes * on (cluster, node) (hpc:node_up == bool 1))

      - record: hpc:partition_memory_used:bytes
        expr: sum by (cluster, partition) (hpc:node_memory_used:bytes * on (cluster, node) (hpc:node_up == bool 1))
